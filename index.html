<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caterpillar - Mapeamento de Processos</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111111'/><polygon points='15,85 50,15 85,85' fill='%23FFCD00'/><polygon points='38,62 50,38 62,62' fill='%23111111'/><rect x='25' y='68' width='50' height='8' fill='%23ffffff'/></svg>">
    
    <style>
        :root {
            --cat-yellow: #FFCD00; 
            --cat-black: #111111;  
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --text-color: #ffffff;
            --border-color: #3a3a3a;
            --muted-text: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 4px; 
            border-top: 6px solid var(--cat-yellow); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        h1 { 
            color: var(--cat-yellow);
            padding-bottom: 10px; 
            font-size: 24px;
        }

        h2 {
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-color);
            margin-top: 30px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--muted-text);
            letter-spacing: 0.5px;
        }

        input {
            padding: 12px;
            background-color: var(--cat-black);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--cat-yellow);
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 14px;
            font-weight: 900;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s, 0.1s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:active { transform: scale(0.98); }

        .btn-start { background-color: var(--cat-yellow); color: var(--cat-black); }
        .btn-start:hover { background-color: #e6b800; }

        .btn-next { background-color: #e6b800; color: var(--text-color); border: 1px solid #555; }
        .btn-next:hover { background-color: #e6b800; }

        .btn-end { background-color: #d9534f; color: white; }
        .btn-end:hover { background-color: #c9302c; }

        button:disabled {
            background-color: #333 !important;
            color: #666 !important;
            border-color: #222 !important;
            cursor: not-allowed;
        }

        .status-panel {
            background-color: var(--cat-black);
            padding: 15px;
            border-left: 4px solid var(--cat-yellow);
            border-radius: 4px;
            margin-bottom: 30px;
            font-size: 15px;
            line-height: 1.5;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            background-color: var(--cat-black);
            color: var(--cat-yellow);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        tr:hover { background-color: #2d2d2d; }

        .alerta-sobra {
            color: #ff4d4d;
            font-weight: bold;
        }

        .clear-btn {
            background-color: transparent;
            color: #d9534f;
            border: 1px solid #d9534f;
            padding: 8px 15px;
            font-size: 11px;
            margin-top: 15px;
            float: right;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .clear-btn:hover { background-color: #d9534f; color: white; }

        .btn-delete-row {
            padding: 6px 10px; 
            font-size: 11px; 
            background-color: #d9534f; 
            color: white; 
            border-radius: 4px; 
            width: auto; 
            font-weight: bold;
            flex: none;
        }
        .btn-delete-row:hover { background-color: #c9302c; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mapeamento do Turno - CME</h1>

    <div class="form-group">
        <div class="input-box">
            <label for="inputQtdFornecedores">Quantidade de Fornecedores do Dia</label>
            <input type="number" id="inputQtdFornecedores" placeholder="Ex: 5">
        </div>
        <div class="input-box">
            <label for="inputCaixas">Total de Caixas do Dia</label>
            <input type="number" id="inputCaixas" placeholder="Ex: 650">
        </div>
        <div class="input-box">
            <label for="inputPessoas">Quantidade de Pessoas no Turno</label>
            <input type="number" id="inputPessoas" placeholder="Mão de obra do dia" value="3">
        </div>
        <div class="input-box">
            <label for="inputDataProcesso">Data do Processo</label>
            <input type="date" id="inputDataProcesso">
        </div>
        <div class="input-box" style="grid-column: span 2;">
            <label for="inputPedidosSobrando" style="color: #ff6666;">Pedidos Pendentes (Não deu tempo de recolher no estoque? Deixe 0 se terminou tudo)</label>
            <input type="number" id="inputPedidosSobrando" value="0" placeholder="Ex: 15">
        </div>
    </div>

    <div class="actions">
        <button id="btnIniciar" class="btn-start" onclick="iniciarTurno()">1. Iniciar Separação</button>
        <button id="btnConferencia" class="btn-next" onclick="iniciarConferencia()" disabled>2. Ir para Conferência (22:00)</button>
        <button id="btnFinalizar" class="btn-end" onclick="finalizarTurno()" disabled>3. Finalizar e Despachar</button>
    </div>

    <div id="statusPanel" class="status-panel">
        <b>Status:</b> Pronto para iniciar o monitoramento do turno. Insira os dados consolidados acima.
    </div>

    <h2>Dados Consolidados por Turno</h2>
    
    <div class="input-box" style="margin-bottom: 20px; max-width: 300px;">
        <label for="inputBuscaData">Pesquisar por Data (DD/MM/AAAA)</label>
        <input type="text" id="inputBuscaData" placeholder="Ex: 11/07/2026" oninput="atualizarTabela()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Fornecedores</th>
                    <th>Total Caixas</th>
                    <th>Equipe</th>
                    <th>Tempo Sep.</th>
                    <th>Tempo Conf.</th>
                    <th>Tempo Total</th>
                    <th>Produtividade Média</th>
                    <th>Pedidos Pendentes</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
            </tbody>
        </table>
    </div>
    
    <button class="clear-btn" onclick="limparRegistros()">Limpar Histórico Completo</button>
</div>

<script>
    let tInicioGeral = null;
    let tInicioConferencia = null;
    let tempoSeparacaoMinutos = 0;

    document.getElementById("inputDataProcesso").value = new Date().toISOString().split('T')[0];

    function obterHistorico() {
        const dados = localStorage.getItem("historicoTurnosExpedicao");
        return dados ? JSON.parse(dados) : [];
    }

    function iniciarTurno() {
        const fornecedores = document.getElementById("inputQtdFornecedores").value;
        const caixas = document.getElementById("inputCaixas").value;

        if (!fornecedores || !caixas) {
            alert("Preencha a quantidade de fornecedores e o total de caixas antes de iniciar o turno!");
            return;
        }

        tInicioGeral = Date.now();
        const horaFormatada = new Date(tInicioGeral).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        document.getElementById("statusPanel").innerHTML = `⏳ <b>Turno em andamento!</b><br>Processando <b>${caixas} caixas</b> vindas de <b>${fornecedores} fornecedores</b> distintos.<br>Processo iniciado em tempo real às: <b>${horaFormatada} hrs</b>.`;
        
        document.getElementById("btnIniciar").disabled = true;
        document.getElementById("btnConferencia").disabled = false;
        bloquearInputs(true);
    }

    function iniciarConferencia() {
        tInicioConferencia = Date.now();
        const diferenca = tInicioConferencia - tInicioGeral;
        tempoSeparacaoMinutos = Math.round((diferenca / 1000) / 60);

        document.getElementById("statusPanel").innerHTML = `🔍 <b>Fase 2: Conferência e Fechamento Iniciados!</b><br>A etapa de recolhimento durou <b>${tempoSeparacaoMinutos} minutos</b>.<br>A equipe mudou de função para fechar as caixas vazias trazidas pela empilhadeira.`;
        
        document.getElementById("btnConferencia").disabled = true;
        document.getElementById("btnFinalizar").disabled = false;
    }

    function finalizarTurno() {
        const tFimGeral = Date.now();
        const diferencaConferencia = tFimGeral - tInicioConferencia;
        const tempoConferenciaMinutos = Math.round((diferencaConferencia / 1000) / 60);
        
        const tempoTotalMinutos = tempoSeparacaoMinutos + tempoConferenciaMinutos;

        const fornecedores = document.getElementById("inputQtdFornecedores").value;
        const caixas = Number(document.getElementById("inputCaixas").value);
        const pessoas = Number(document.getElementById("inputPessoas").value) || 1;
        const dataProcesso = document.getElementById("inputDataProcesso").value;
        const pedidosSobrando = Number(document.getElementById("inputPedidosSobrando").value) || 0;

        const tempoTotalHoras = tempoTotalMinutos / 60;
        const homemHoraTotal = tempoTotalHoras * pessoas;
        const caixasPorHH = homemHoraTotal > 0 ? (caixas / homemHoraTotal).toFixed(1) : 0;

        const novoTurno = {
            data: dataProcesso.split('-').reverse().join('/'),
            fornecedores: `${fornecedores} forn.`,
            caixas: caixas,
            pessoas: `${pessoas} op.`,
            tempoSep: `${tempoSeparacaoMinutos} min`,
            tempoConf: `${tempoConferenciaMinutos} min`,
            tempoTotal: `${tempoTotalMinutos} min`,
            produtividade: `${caixasPorHH} cx/h por pessoa`,
            sobra: pedidosSobrando
        };

        const historicoAtual = obterHistorico();
        historicoAtual.push(novoTurno);
        localStorage.setItem("historicoTurnosExpedicao", JSON.stringify(historicoAtual));

        atualizarTabela();
        bloquearInputs(false);
        resetarBotoes();
        limparInputs();

        document.getElementById("statusPanel").innerHTML = `✅ <b>Turno Finalizado e Registrado!</b> Dados computados com sucesso.`;
    }

    function atualizarTabela() {
        const corpo = document.getElementById("tabelaCorpo");
        corpo.innerHTML = "";
        const historicoAtual = obterHistorico();
        const termoBusca = document.getElementById("inputBuscaData") ? document.getElementById("inputBuscaData").value.trim() : "";

        historicoAtual.forEach((reg, index) => {
            if (termoBusca && !reg.data.includes(termoBusca)) {
                return; 
            }

            const classeSobra = reg.sobra > 0 ? 'class="alerta-sobra"' : '';
            const textoSobra = reg.sobra > 0 ? `⚠️ ${reg.sobra} pendentes` : '0 (Zerado)';

            const linha = `<tr>
                <td>${reg.data}</td>
                <td>${reg.fornecedores}</td>
                <td>${reg.caixas}</td>
                <td>${reg.pessoas}</td>
                <td>${reg.tempoSep}</td>
                <td>${reg.tempoConf}</td>
                <td>${reg.tempoTotal}</td>
                <td><strong>${reg.produtividade}</strong></td>
                <td ${classeSobra}>${textoSobra}</td>
                <td>
                    <button class="btn-delete-row" onclick="excluirItem(${index})">✕</button>
                </td>
            </tr>`;
            corpo.innerHTML += linha;
        });
    }

    function excluirItem(index) {
        let historicoAtual = obterHistorico();
        if (confirm(`Deseja realmente excluir o registro do dia ${historicoAtual[index].data}?`)) {
            historicoAtual.splice(index, 1);
            localStorage.setItem("historicoTurnosExpedicao", JSON.stringify(historicoAtual));
            atualizarTabela();
        }
    }

    function bloquearInputs(status) {
        document.getElementById("inputQtdFornecedores").disabled = status;
        document.getElementById("inputCaixas").disabled = status;
        document.getElementById("inputPessoas").disabled = status;
        document.getElementById("inputDataProcesso").disabled = status;
    }

    function resetarBotoes() {
        document.getElementById("btnIniciar").disabled = false;
        document.getElementById("btnConferencia").disabled = true;
        document.getElementById("btnFinalizar").disabled = true;
    }

    function limparInputs() {
        document.getElementById("inputQtdFornecedores").value = "";
        document.getElementById("inputCaixas").value = "";
        document.getElementById("inputPessoas").value = "3";
        document.getElementById("inputPedidosSobrando").value = "0";
        document.getElementById("inputDataProcesso").value = new Date().toISOString().split('T')[0];
    }

    function limparRegistros() {
        if (confirm("Tem certeza de que deseja apagar todo o histórico de turnos mapeados?")) {
            localStorage.removeItem("historicoTurnosExpedicao");
            atualizarTabela();
            document.getElementById("statusPanel").innerHTML = "<b>Status:</b> Histórico deletado com sucesso. Pronto para novos registros.";
        }
    }

    
    function salvarEstadoAtual(statusTexto) {
        const estado = {
        tInicioGeral: tInicioGeral,
        tInicioConferencia: tInicioConferencia,
        tempoSeparacaoMinutos: tempoSeparacaoMinutos,
        statusPanelHtml: statusTexto,
        btnIniciarDisabled: document.getElementById("btnIniciar").disabled,
        btnConferenciaDisabled: document.getElementById("btnConferencia").disabled,
        btnFinalizarDisabled: document.getElementById("btnFinalizar").disabled
        };
        localStorage.setItem("estadoTurnoAtual", JSON.stringify(estado));
    }


    function verificarProcessoPendente() {
        const estadoSalvo = localStorage.getItem("estadoTurnoAtual");
        if (estadoSalvo) {
        const estado = JSON.parse(estadoSalvo);
        
        if (confirm("Detectamos que um mapeamento estava em andamento. Deseja retomar de onde parou?")) {
            tInicioGeral = estado.tInicioGeral;
            tInicioConferencia = estado.tInicioConferencia;
            tempoSeparacaoMinutos = estado.tempoSeparacaoMinutos;

            document.getElementById("btnIniciar").disabled = estado.btnIniciarDisabled;
            document.getElementById("btnConferencia").disabled = estado.btnConferenciaDisabled;
            document.getElementById("btnFinalizar").disabled = estado.btnFinalizarDisabled;
            document.getElementById("statusPanel").innerHTML = estado.statusPanelHtml;
            
            bloquearInputs(true);
            } else {
            localStorage.removeItem("estadoTurnoAtual");
            }
        }
    }

    function iniciarTurno() {
        const fornecedores = document.getElementById("inputQtdFornecedores").value;
        const caixas = document.getElementById("inputCaixas").value;

        if (!fornecedores || !caixas) {
        alert("Preencha a quantidade de fornecedores e o total de caixas antes de iniciar o turno!");
        return;
        }

        tInicioGeral = Date.now();
        const horaFormatada = new Date(tInicioGeral).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        const textoStatus = `⏳ <b>Turno em andamento!</b><br>Processando <b>${caixas} caixas</b> vindas de <b>${fornecedores} fornecedores</b> distintos.<br>Processo iniciado em tempo real às: <b>${horaFormatada} hrs</b>.`;
        document.getElementById("statusPanel").innerHTML = textoStatus;
        
        document.getElementById("btnIniciar").disabled = true;
        document.getElementById("btnConferencia").disabled = false;
        bloquearInputs(true);

        salvarEstadoAtual(textoStatus);
    }

    function iniciarConferencia() {
        tInicioConferencia = Date.now();
        const diferenca = tInicioConferencia - tInicioGeral;
        tempoSeparacaoMinutos = Math.round((diferenca / 1000) / 60);

        const textoStatus = `🔍 <b>Fase 2: Conferência e Fechamento Iniciados!</b><br>A etapa de recolhimento durou <b>${tempoSeparacaoMinutos} minutos</b>.<br>A equipe mudou de função para fechar as caixas vazias trazidas pela empilhadeira.`;
        document.getElementById("statusPanel").innerHTML = textoStatus;
        
        document.getElementById("btnConferencia").disabled = true;
        document.getElementById("btnFinalizar").disabled = false;

        salvarEstadoAtual(textoStatus);
    }

    function finalizarTurno() {
        const tFimGeral = Date.now();
        const diferencaConferencia = tFimGeral - tInicioConferencia;
        const tempoConferenciaMinutos = Math.round((diferencaConferencia / 1000) / 60);
        
        const tempoTotalMinutos = tempoSeparacaoMinutos + tempoConferenciaMinutos;

        const fornecedores = document.getElementById("inputQtdFornecedores").value;
        const caixas = Number(document.getElementById("inputCaixas").value);
        const pessoas = Number(document.getElementById("inputPessoas").value) || 1;
        const dataProcesso = document.getElementById("inputDataProcesso").value;
        const pedidosSobrando = Number(document.getElementById("inputPedidosSobrando").value) || 0;

        const tempoTotalHoras = tempoTotalMinutos / 60;
        const homemHoraTotal = tempoTotalHoras * pessoas;
        const caixasPorHH = homemHoraTotal > 0 ? (caixas / homemHoraTotal).toFixed(1) : 0;

        const novoTurno = {
            data: dataProcesso.split('-').reverse().join('/'),
            fornecedores: `${fornecedores} forn.`,
            caixas: caixas,
            pessoas: `${pessoas} op.`,
            tempoSep: `${tempoSeparacaoMinutos} min`,
            tempoConf: `${tempoConferenciaMinutos} min`,
            tempoTotal: `${tempoTotalMinutos} min`,
            produtividade: `${caixasPorHH} cx/h por pessoa`,
            sobra: pedidosSobrando
        };

        const historicoAtual = obterHistorico();
        historicoAtual.push(novoTurno);
        localStorage.setItem("historicoTurnosExpedicao", JSON.stringify(historicoAtual));

        localStorage.removeItem("estadoTurnoAtual");

        atualizarTabela();
        bloquearInputs(false);
        resetarBotoes();
        limparInputs();

        document.getElementById("statusPanel").innerHTML = `✅ <b>Turno Finalizado e Registrado!</b> Dados computados com sucesso.`;
    }

    atualizarTabela();
    verificarProcessoPendente();
</script>

</body>
</html>
