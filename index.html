<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caterpillar - Produtividade CME</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23111111'/><polygon points='15,85 50,15 85,85' fill='%23FFCD00'/><polygon points='38,62 50,38 62,62' fill='%23111111'/><rect x='25' y='68' width='50' height='8' fill='%23ffffff'/></svg>">
    
    <style>
        :root {
            --cat-yellow: #FFCD00; 
            --cat-black: #111111;  
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --text-color: #ffffff;
            --border-color: #3a3a3a;
            --muted-text: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 4px; 
            border-top: 6px solid var(--cat-yellow); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        h1 { 
            color: var(--cat-yellow);
            font-size: 22px;
            margin-bottom: 30px;
            margin-top: 10px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--muted-text);
            letter-spacing: 0.5px;
        }

        input {
            padding: 12px;
            background-color: var(--cat-black);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--cat-yellow);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px 8px;
            font-size: 12px;
            font-weight: 900;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:active { transform: scale(0.98); }

        .btn-start { background-color: var(--cat-yellow); color: var(--cat-black); }
        .btn-start:hover { background-color: #e6b800; }

        .btn-pause { background-color: #f0ad4e; color: var(--cat-black); }
        .btn-pause:hover { background-color: #ec971f; }

        .btn-return { background-color: #5bc0de; color: white; }
        .btn-return:hover { background-color: #31b0d5; }

        .btn-end { background-color: #d9534f; color: white; }
        .btn-end:hover { background-color: #c9302c; }

        button:disabled {
            background-color: #333 !important;
            color: #666 !important;
            border-color: #222 !important;
            cursor: not-allowed;
        }

        .status-panel {
            background-color: var(--cat-black);
            padding: 15px;
            border-left: 4px solid var(--cat-yellow);
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                min-height: 95vh;
            }

            .container {
                padding: 20px 15px;
                box-shadow: none;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .form-group {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .full-width {
                grid-column: span 1;
            }

            input {
                padding: 14px 12px;
                font-size: 16px;
            }

            .actions {
                flex-direction: column;
                gap: 12px;
            }

            button {
                padding: 16px;
                font-size: 14px;
                width: 100%;
            }

            .status-panel {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Produtividade por Fornecedor - CME</h1>

    <div class="form-group">
        <div class="input-box">
            <label for="fornOperador">Funcionário (Nome ou RE)</label>
            <input type="text" id="fornOperador" placeholder="Identifique-se">
        </div>
        <div class="input-box">
            <label for="fornNome">Fornecedor</label>
            <input type="text" id="fornNome" placeholder="Ex: Bosch, SKF">
        </div>
        <div class="input-box full-width">
            <label for="fornCaixas">Quantidade de Caixas</label>
            <input type="number" id="fornCaixas" placeholder="Quantidade total a separar">
        </div>
    </div>

    <div class="actions">
        <button id="btnFornIniciar" class="btn-start" onclick="iniciarForn()">1. Iniciar</button>
        <button id="btnFornIntervalo" class="btn-pause" onclick="pausaIntervalo()" disabled>2. Intervalo</button>
        <button id="btnFornRetorno" class="btn-return" onclick="retornarIntervalo()" disabled>3. Voltar</button>
        <button id="btnFornFinalizar" class="btn-end" onclick="finalizarForn()" disabled>4. Finalizar</button>
    </div>

    <div id="statusPanelForn" class="status-panel">
        <b>Status:</b> Pronto para iniciar. Insira os dados acima para rodar o cronômetro.
    </div>
</div>

<script>
    let tFornInicio;
    let tempoPausadoInicio;
    let tempoTotalPausa = 0;
    
    const URL_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbyT6aCdMkO--7ZXcuPRM_1wNgGOLLgqtSLacwBjERO6iJcncVv2xZPTSuwqki1dK8J8Sw/exec";

    function iniciarForn() {
        const operador = document.getElementById("fornOperador").value.trim();
        const fornecedor = document.getElementById("fornNome").value.trim();
        const caixas = document.getElementById("fornCaixas").value;

        if (!operador || !fornecedor || !caixas) {
            alert("Atenção: Preencha todos os campos antes de iniciar!");
            return;
        }

        tFornInicio = Date.now();
        tempoTotalPausa = 0;
        const horaFormatada = new Date(tFornInicio).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        document.getElementById("statusPanelForn").innerHTML = `⏳ <b>Cronômetro Rodando...</b><br>Funcionário: <b>${operador}</b> | Fornecedor: <b>${fornecedor}</b>.<br>Iniciado às ${horaFormatada}.`;

        document.getElementById("btnFornIniciar").disabled = true;
        document.getElementById("btnFornIntervalo").disabled = false;
        document.getElementById("btnFornFinalizar").disabled = false;
        bloquearInputsForn(true);

        salvarEstadoLocalStorage();
    }

    function pausaIntervalo() {
        tempoPausadoInicio = Date.now();

        document.getElementById("btnFornIntervalo").disabled = true;
        document.getElementById("btnFornRetorno").disabled = false;
        
        document.getElementById("statusPanelForn").innerHTML = `☕ <b>Em Intervalo / Refeição...</b><br>O tempo do cronômetro está congelado temporariamente.`;

        salvarEstadoLocalStorage();
    }

    function retornarIntervalo() {
        if (tempoPausadoInicio) {
            const agora = Date.now();
            tempoTotalPausa += (agora - tempoPausadoInicio);
            tempoPausadoInicio = null;
        }

        document.getElementById("btnFornRetorno").disabled = true;
        document.getElementById("btnFornIntervalo").disabled = false;
        
        const operador = document.getElementById("fornOperador").value;
        const fornecedor = document.getElementById("fornNome").value;
        
        document.getElementById("statusPanelForn").innerHTML = `⏳ <b>Cronômetro Retomado!</b><br>Funcionário: <b>${operador}</b> | Fornecedor: <b>${fornecedor}</b>.`;

        salvarEstadoLocalStorage();
    }

    function finalizarForn() {
        document.getElementById("btnFornFinalizar").disabled = true;
        document.getElementById("btnFornIntervalo").disabled = true;
        document.getElementById("btnFornRetorno").disabled = true;

        document.getElementById("statusPanelForn").innerHTML = `⚙️ <b>Salvando e processando dados...</b> Por favor, aguarde.`;

        const tFornFim = Date.now();
        
        if (tempoPausadoInicio) {
            tempoTotalPausa += (tFornFim - tempoPausadoInicio);
        }

        const diferencaMilissegundos = (tFornFim - tFornInicio) - tempoTotalPausa;
        const milissegundosLiquidos = diferencaMilissegundos > 0 ? diferencaMilissegundos : 0;
        
        const tempoMinutosNum = (milissegundosLiquidos / 1000) / 60;
        const tempoMinutosFormatado = tempoMinutosNum.toFixed(1);

        const operador = document.getElementById("fornOperador").value.trim();
        const fornecedor = document.getElementById("fornNome").value.trim();
        const caixas = Number(document.getElementById("fornCaixas").value);

        const cxPorMin = tempoMinutosNum > 0 ? Number((caixas / tempoMinutosNum).toFixed(2)) : 0;
        const tempoHoras = tempoMinutosNum / 60;
        const cxPorHora = tempoHoras > 0 ? Number((caixas / tempoHoras).toFixed(1)) : 0;
        
        const dataHoje = new Date().toLocaleDateString('pt-BR');

        const pacoteDados = {
            data: dataHoje,
            operador: operador,
            fornecedor: fornecedor,
            caixas: caixas,
            tempo: Number(tempoMinutosFormatado), 
            cxMinuto: cxPorMin,                  
            cxHora: cxPorHora                    
        };

        fetch(URL_GOOGLE_SHEETS, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(pacoteDados)
        })
        .then(() => {
            localStorage.removeItem("estadoFornSalvo");
            bloquearInputsForn(false);
            
            document.getElementById("btnFornIniciar").disabled = false;
            document.getElementById("btnFornIntervalo").disabled = true;
            document.getElementById("btnFornRetorno").disabled = true;
            document.getElementById("btnFornFinalizar").disabled = true;
            
            document.getElementById("fornNome").value = "";
            document.getElementById("fornCaixas").value = "";
            document.getElementById("statusPanelForn").innerHTML = `✅ <b>Sucesso!</b> Dados salvos na nuvem (${tempoMinutosFormatado} min líquidos). Pronto para o próximo fornecedor.`;
        })
        .catch(error => {
            console.error(error);
            alert("Erro ao enviar para o servidor. Tente novamente.");
            document.getElementById("btnFornFinalizar").disabled = false;
        });
    }

    function bloquearInputsForn(status) {
        document.getElementById("fornOperador").disabled = status;
        document.getElementById("fornNome").disabled = status;
        document.getElementById("fornCaixas").disabled = status;
    }

    function salvarEstadoLocalStorage() {
        const operador = document.getElementById("fornOperador").value;
        const fornecedor = document.getElementById("fornNome").value;
        const caixas = document.getElementById("fornCaixas").value;

        localStorage.setItem("estadoFornSalvo", JSON.stringify({
            tFornInicio: tFornInicio,
            tempoTotalPausa: tempoTotalPausa,
            tempoPausadoInicio: tempoPausadoInicio,
            operador: operador,
            fornecedor: fornecedor,
            caixas: caixas
        }));
    }

    function verificarRecuperacao() {
        const salvo = localStorage.getItem("estadoFornSalvo");
        if (salvo) {
            const estado = JSON.parse(salvo);
            if (confirm("Identificamos uma contagem que foi interrompida. Deseja retomar o cronômetro?")) {
                tFornInicio = estado.tFornInicio;
                tempoTotalPausa = estado.tempoTotalPausa || 0;
                tempoPausadoInicio = estado.tempoPausadoInicio || null;

                document.getElementById("fornOperador").value = estado.operador;
                document.getElementById("fornNome").value = estado.fornecedor;
                document.getElementById("fornCaixas").value = estado.caixas;

                document.getElementById("btnFornIniciar").disabled = true;
                document.getElementById("btnFornFinalizar").disabled = false;
                
                if (tempoPausadoInicio) {
                    document.getElementById("btnFornIntervalo").disabled = true;
                    document.getElementById("btnFornRetorno").disabled = false;
                    document.getElementById("statusPanelForn").innerHTML = `☕ <b>Em Intervalo / Refeição...</b>`;
                } else {
                    document.getElementById("btnFornIntervalo").disabled = false;
                    document.getElementById("btnFornRetorno").disabled = true;
                    document.getElementById("statusPanelForn").innerHTML = `⏳ <b>Cronômetro Retomado!</b>`;
                }

                bloquearInputsForn(true);
            } else {
                localStorage.removeItem("estadoFornSalvo");
            }
        }
    }

    verificarRecuperacao();
</script>

</body>
</html>
